<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계획서 작업대</title>
<meta name="description" content="공고가 원하는 것과 우리 초안을 나란히 놓고, 배점을 얼마나 채웠는지 보며 계획서를 만듭니다.">
<link rel="stylesheet" href="/lib/site.css">
<style>
  main { max-width:1180px; margin:0 auto; padding:24px 20px 64px; }
  .head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  h1 { font-size:24px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .sub { color:var(--sub); font-size:14px; margin:4px 0 0; }
  .steps { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin:18px 0 0; }
  .step { padding:12px 14px; font-size:13px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  .step b { display:flex; align-items:center; gap:8px; font-size:14px; }
  .step b i { display:grid; place-items:center; width:22px; height:22px; border-radius:7px; background:var(--brand-soft); color:var(--sub); font-style:normal; font-size:12px; }
  .step.now { border-color:var(--brand); box-shadow:var(--shadow); }
  .step.now b i { background:var(--brand); color:var(--brand-ink); }
  .step span { display:block; color:var(--sub); font-size:12px; margin:4px 0 0; }
  .step input { display:block; max-width:100%; margin-top:8px; font-size:12px; color:var(--muted); }
  .step input::file-selector-button { margin-right:8px; padding:5px 10px; font:inherit; font-size:12px; font-weight:700; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .draft .h2 { display:block; margin:0 0 6px; font-size:16px; font-weight:800; }
  .draft .h3 { display:block; margin:10px 0 2px; font-size:14px; font-weight:800; color:var(--ink); }
  .next { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:14px 0; padding:12px 14px; border-radius:12px; background:var(--go-soft); color:var(--go-text); font-size:15px; font-weight:600; }
  .next button { flex:none; padding:8px 16px; font:inherit; font-size:14px; font-weight:700; color:var(--go-ink); background:var(--go); border:0; border-radius:10px; cursor:pointer; }
  .covrow { display:flex; align-items:center; gap:12px; font-size:13px; color:var(--sub); }
  .bar { flex:1; height:8px; background:var(--brand-soft); border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--go); }
  .cols { display:grid; grid-template-columns:200px minmax(0,1fr) minmax(0,1.25fr); gap:14px; margin-top:16px; align-items:start; }
  .cols > .card { padding:14px 16px; }
  .cols h2 { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); font-weight:700; margin:0 0 8px; }
  .toc button { display:block; width:100%; text-align:left; padding:9px 10px; margin:0 0 4px; font:inherit; font-size:14px; font-weight:600; color:var(--ink); background:none; border:0; border-radius:8px; cursor:pointer; }
  .toc button:hover { background:var(--page); }
  .toc button.on { background:var(--brand-soft); }
  .toc small { display:block; color:var(--sub); font-size:12px; font-weight:400; }
  .need { border-top:1px solid var(--line); padding:10px 0; font-size:14px; }
  .need:first-child { border-top:0; padding-top:0; }
  .need ul { margin:4px 0; padding-left:18px; }
  .need .meta { color:var(--sub); font-size:12px; }
  .draft { white-space:pre-wrap; font-size:14px; line-height:1.75; }
  .draft mark, .choose mark { background:var(--hold-soft); color:var(--hold); border-radius:4px; padding:0 3px; font-weight:700; }
  .note { color:var(--sub); font-size:13px; }
  .q { margin:4px 0; padding-left:18px; font-size:14px; }
  details { margin-top:16px; padding:12px 16px; }
  summary { cursor:pointer; color:var(--sub); font-size:14px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th, td { text-align:left; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-weight:600; width:30%; }
  .choose { margin-top:16px; padding:14px 16px; }
  .choose h2 { font-size:15px; font-weight:800; margin:0 0 4px; }
  .choose h3 { font-size:13px; color:var(--muted); font-weight:700; margin:14px 0 6px; }
  .grp { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:0 0 8px; }
  .grp.done { border-color:var(--go); }
  .grp.off ul { color:var(--sub); text-decoration:line-through; }
  .grp .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px; font-weight:700; }
  .grp .top small { color:var(--sub); font-weight:400; }
  .grp ul { margin:6px 0 0; padding-left:0; list-style:none; font-size:13px; line-height:1.6; }
  .grp li label { display:flex; gap:6px; align-items:flex-start; }
  .grp .warn { color:var(--hold); font-size:12px; margin-left:22px; }
  .grp .acts button { margin-left:6px; }
  .grp .acts button.on { background:var(--go); color:var(--go-ink); border-color:var(--go); }
  .star { color:var(--hold); font-size:12px; font-weight:700; }
  .choose details { margin-top:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; }
  .savebar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 0; font-size:13px; color:var(--sub); }
  .savebar .bad { margin:0; }
  .savebar .acts { display:flex; gap:6px; flex-wrap:wrap; }
  .fill { display:flex; gap:6px; align-items:center; margin:4px 0 0 0; }
  .fill input { flex:1; min-width:0; padding:5px 8px; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; }
  .fill input.done { border-color:var(--go); }
  .fill small { color:var(--sub); white-space:nowrap; }
  .q input { display:block; width:100%; max-width:420px; margin:4px 0 8px; padding:5px 8px; font:inherit; font-size:13px; border:1px solid var(--line); border-radius:8px; }
  .move { margin-left:6px; padding:1px 8px; font:inherit; font-size:11px; color:var(--sub); background:none; border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  @media (max-width:900px) { .cols { grid-template-columns:minmax(0,1fr); } .steps { grid-template-columns:repeat(2, minmax(0,1fr)); } }
</style>
</head>
<body>
<header class="site-top"><div class="in">
  <a class="logo" href="/"><i>m</i>ms12 계획서</a>
  <nav><a href="/radar/">공고 찾기</a><a class="here" href="/plan/">내 계획서</a><a href="/baeumteo/">견본</a><a href="/files/">자료 내려받기</a></nav>
</div></header>
<main>
  <div class="head"><div><h1 id="title">새 계획서</h1>
  <p class="sub" id="meta">공고 파일부터 올리세요. 파일은 이 브라우저 안에서만 읽고 어디로도 보내지 않습니다. 올린 파일은 새로고침하면 다시 올려야 하고, 고른 것·채운 값은 이 브라우저에 공고마다 따로 남습니다.</p></div></div>

  <div class="steps" id="steps"></div>
  <div class="savebar" id="savebar" hidden></div>
  <input id="importFile" type="file" accept=".json" hidden>
  <div class="next" id="next"></div>
  <div class="covrow"><span id="covText"></span><div class="bar"><i id="cov" style="width:0;transition:width .8s cubic-bezier(.2,.7,.2,1)"></i></div></div>

  <div class="cols">
    <div class="card"><h2>목차</h2><div class="toc" id="toc"><p class="note">공고를 올리면 나옵니다</p></div></div>
    <div class="card"><h2>공고가 원하는 것</h2><div id="need"></div></div>
    <div class="card"><h2>우리 초안 <button class="btn sm" id="marks" type="button" hidden>표시 보기</button></h2><div id="draft"></div></div>
  </div>

  <div class="card choose" id="choose" hidden></div>

  <details class="card" id="rulesBox" hidden><summary>하드 제약 · 출력 규칙</summary><div id="rules"></div></details>
</main>
<script type="module">
import { extractHwpxText } from '../lib/hwpx-text.js';
import { extractHwpDocument } from '../lib/hwp-text.js';
import { pdfDocumentText } from '../lib/pdf-text.js';
import { readPlan } from '../rfp/rfp-plan.js';
import { STEPS, chaptersOf, sortDraftFiles, coverage, pendingsOf, questionsOf, daysLeft, nextStep } from './workspace.js';
import { choicesOf } from './choices.js';
import { noticeKey, emptySaved, writeSaved, readSaved, exportFile, importFile, savedLabel } from './saved.js';

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const won = value => `${Number(value).toLocaleString('ko-KR')}원`;

// 화면이 들고 있는 것은 올린 글과 사람이 정한 것(saved)뿐이다. 판정은 workspace.js와 readPlan이 한다.
// saved = 고른 것·채운 값·질문 답·약속으로 옮긴 줄(11-12). 공고마다 다른 칸(saved.js noticeKey)에 고를 때마다 바로 남긴다.
const state = { noticeText: '', noticeNames: [], project: null, facts: [], files: [], open: null, marks: false, saved: emptySaved(), key: null, saveStatus: null };

// 저장소를 여는 것부터 막힐 수 있다(사생활 보호 창 등) — 던지지 않고 null.
const store = (() => { try { return window.localStorage; } catch { return null; } })();
function persist() {
  if (!state.key) return;
  state.saveStatus = writeSaved(store, state.key, state.saved);
  if (state.saveStatus.ok) state.saved.savedAt = state.saveStatus.savedAt;
}
function change(mutate) { mutate(state.saved); persist(); draw(); }

// 질문 답을 project.json에 넣어 내려받는다 — 생성 도구가 읽으면 그 값이 모든 장에 함께 들어간다.
function projectWithAnswers() {
  const project = JSON.parse(JSON.stringify(state.project || {}));
  for (const [key, value] of Object.entries(state.saved.answers || {})) {
    if (!String(value).trim()) continue;
    if (key === 'roles' || key === 'lead' || key === 'deadline') project[key] = value;
    else if (key.startsWith('partner-')) { const index = Number(key.slice(8)); project.partners = project.partners || []; project.partners[index] = { ...(project.partners[index] || {}), name: value }; }
    else if (key.startsWith('fill:')) { project.fill = { ...(project.fill || {}), [key.slice(5)]: value }; }
  }
  return project;
}
function download(name, text) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  link.download = name;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

// PDF·DOCX 읽는 도구는 node_modules의 그 판을 빌드가 /lib/vendor/로 복사해 같은 주소에서 낸다(11-18, tools/build.mjs).
// Node 도구와 같은 판이라야 같은 글자가 나온다. 바깥 주소는 두지 않는다.
const VENDOR = new URL('../lib/vendor/', location.href).href;
const PDFJS = VENDOR.replace(/\/$/, '');
const MAMMOTH = `${VENDOR}mammoth.browser.min.js`;
let mammothReady = null;
const loadMammoth = () => mammothReady ||= new Promise((resolve, reject) => {
  const script = Object.assign(document.createElement('script'), { src: MAMMOTH, onload: () => resolve(window.mammoth), onerror: () => { mammothReady = null; reject(new Error('DOCX 읽기 도구를 불러오지 못했습니다 — 인터넷 연결을 확인하세요')); } });
  document.head.append(script);
});

// 글자와 쪽 수(PDF만 — 다른 형식은 쪽을 모른다, null).
async function readOne(file) {
  const extension = file.name.split('.').pop().toLowerCase();
  if (['txt', 'md', 'json'].includes(extension)) return { text: await file.text(), pages: null };
  if (extension === 'hwpx') return { text: await extractHwpxText(await file.arrayBuffer()), pages: null };
  if (extension === 'hwp') return { text: (await extractHwpDocument(await file.arrayBuffer())).text, pages: null };
  if (extension === 'pdf') {
    let pdfjs;
    try { pdfjs = await import(`${PDFJS}/pdf.min.mjs`); } catch { throw new Error('PDF 읽기 도구를 불러오지 못했습니다 — 인터넷 연결을 확인하세요'); }
    pdfjs.GlobalWorkerOptions.workerSrc = `${PDFJS}/pdf.worker.min.mjs`;
    let pdf;
    try { pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise; } catch (error) {
      throw new Error(/Password/i.test(String(error?.name || error?.message)) ? '암호가 걸린 PDF입니다' : `PDF를 열지 못했습니다 — ${error?.message || '손상되었거나 읽기 도구가 오지 않았습니다'}`);
    }
    const text = await pdfDocumentText(pdf);
    if (text.replace(/\[\d+쪽\]/g, '').trim().length < 20) throw new Error('글자가 없는 스캔 PDF로 보입니다 — 글자를 인식한 PDF나 원본 문서로 올려 주세요');
    return { text, pages: pdf.numPages };
  }
  if (extension === 'docx') {
    const mammoth = await loadMammoth();
    const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { text: result.value, pages: null };
  }
  throw new Error('HWPX·HWP·PDF·DOCX·TXT만 읽습니다');
}
const textOf = async file => (await readOne(file)).text;

function derive() {
  const result = state.noticeText ? readPlan(state.noticeText, { project: state.project || undefined }) : null;
  const plan = result?.plan || null;
  const chapters = plan ? chaptersOf(plan) : [];
  const { byChapter, unmatched } = sortDraftFiles(chapters, state.files);
  const allQuestions = questionsOf(state.project);
  const allPendings = pendingsOf(chapters, byChapter);
  // 화면에서 답했거나 채운 것은 남은 일에서 뺀다(다음 할 일·단계 칸).
  const answered = key => String(state.saved.answers?.[key] ?? '').trim() !== '';
  const questions = allQuestions.filter(q => !answered(q.key));
  const pendings = allPendings.filter(item => String(state.saved.values?.[item.id] ?? '').trim() === '');
  return { result, plan, chapters, drafts: byChapter, unmatched, allQuestions, questions, allPendings, pendings,
    cov: coverage(plan, chapters, byChapter),
    next: nextStep({ noticeText: state.noticeText, plan, facts: state.facts, questions, chapters, drafts: byChapter, pendings }) };
}

function drawSteps(d) {
  const info = {
    // 읽어낸 글자 수(와 PDF면 쪽 수) — 도구로 읽은 것과 같은지 눈으로 견준다(11-18).
    notice: state.noticeText ? `${state.noticeNames.join(', ')}${state.noticePages ? ` · ${state.noticePages}쪽` : ''} · ${state.noticeText.length.toLocaleString('ko-KR')}자${d.plan ? ` · ${d.chapters.length}장` : ''}` : '아직 없음',
    facts: state.facts.length ? `${state.facts.length}개 · ${state.facts.reduce((acc, fact) => acc + fact.text.length, 0).toLocaleString('ko-KR')}자` : '아직 없음',
    questions: d.questions.length ? `남은 질문 ${d.questions.length}개` : '모두 답함',
    draft: `${d.cov.done} / ${d.cov.of}장${d.pendings.length ? ` · 빈 곳 ${d.pendings.length}` : ''}`
  };
  const inputs = {
    notice: '<input id="noticeFile" type="file" accept=".hwpx,.hwp,.pdf,.docx,.txt,.json" multiple title="공고(HWPX·HWP·PDF·DOCX·TXT)와 기관이 정한 것(project.json)">',
    facts: '<input id="factFile" type="file" accept=".hwpx,.hwp,.pdf,.docx,.txt" multiple title="연혁·실적 등 기관 자료">',
    questions: '',
    draft: '<input id="draftFile" type="file" accept=".md,.json" multiple title="생성 도구가 만든 draft_·submit_·choices_·checks_ 파일">'
  };
  $('steps').innerHTML = STEPS.map((step, index) => `<div class="step ${d.next.step === step.key ? 'now' : ''}"><b><i>${index + 1}</i>${esc(step.name)}</b><span>${esc(info[step.key])}</span>${inputs[step.key]}</div>`).join('');
  $('noticeFile').addEventListener('change', event => loadNotice([...event.target.files]));
  $('factFile').addEventListener('change', event => loadFacts([...event.target.files]));
  $('draftFile').addEventListener('change', event => loadDrafts([...event.target.files]));
}

function drawHeader(d) {
  const title = state.project?.notice || (state.noticeText ? state.noticeNames[0] : '새 계획서');
  $('title').textContent = title;
  if (!state.noticeText) return;
  const left = daysLeft(state.project?.deadline);
  const parts = [left == null ? '마감 [확인 필요]' : left >= 0 ? `마감 D-${left}` : '마감 지남'];
  if (state.project?.lead) parts.push(`주관 ${state.project.lead}${state.project.partners?.length ? ` 외 ${state.project.partners.length}곳` : ''}`);
  if (d.plan?.pages?.unused != null) parts.push(`쓰는 쪽 ${d.plan.pages.fixed + d.plan.pages.used} / ${d.plan.pages.total}`);
  if (!state.project) parts.push('project.json을 올리지 않아 평가 항목을 글자 비교로만 붙였습니다');
  $('meta').innerHTML = parts.map(esc).join(' · ');
}

// 「언제 저장됨」과 내보내기·불러오기(11-12). 저장이 막혔으면 그 사실을 말하고 내보내기를 권한다.
function drawSave() {
  $('savebar').hidden = !state.key;
  if (!state.key) return;
  const status = state.saveStatus || { ok: true, savedAt: state.saved.savedAt };
  const moved = Object.keys(state.saved.moved || {}).length;
  $('savebar').innerHTML = `<span id="saveText" class="${status.ok ? '' : 'bad'}">${esc(savedLabel(status))}</span><span class="acts">
    <button class="btn sm" id="exportBtn" type="button">내보내기</button><button class="btn sm" id="importBtn" type="button">불러오기</button>
    ${Object.keys(state.saved.answers || {}).length ? '<button class="btn sm" id="projectBtn" type="button">답 넣은 project.json 받기</button>' : ''}</span>
    ${moved ? `<span class="note">약속으로 옮긴 줄 ${moved}개 — 내보내기 파일의 moved에 기록이 남습니다(→ 꼴 기준을 다듬을 재료)</span>` : ''}`;
  $('exportBtn').onclick = () => download(`고른것_${(state.project?.notice || state.noticeNames[0] || '계획서').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)}.json`, exportFile(state.saved, { key: state.key, notice: state.project?.notice || state.noticeNames.join(', ') }));
  $('importBtn').onclick = () => $('importFile').click();
  if ($('projectBtn')) $('projectBtn').onclick = () => download('project.json', `${JSON.stringify(projectWithAnswers(), null, 2)}\n`);
}
const showSaved = () => { if ($('saveText')) { $('saveText').textContent = savedLabel(state.saveStatus); $('saveText').className = state.saveStatus?.ok ? '' : 'bad'; } };

function drawNext(d) {
  const target = d.next.step === 'notice' ? 'noticeFile' : d.next.step === 'facts' ? 'factFile' : d.next.step === 'questions' ? 'need' : 'draftFile';
  $('next').innerHTML = `<span>다음 할 일 — ${esc(d.next.text)}</span><button type="button">${d.next.step === 'questions' ? '질문 보기' : d.next.step === 'draft' && d.next.chapter ? '초안 파일 올리기' : '올리기'}</button>`;
  $('next').querySelector('button').onclick = () => {
    if (d.next.chapter) state.open = d.next.chapter;
    if (target === 'need') { draw(); $('need').scrollIntoView({ behavior: 'smooth' }); return; }
    $(target).click();
  };
  $('covText').textContent = d.plan ? `배점 채움 ${d.cov.filled.toFixed(1)} / ${d.cov.total}점 (초안이 있는 장의 배점)` : '';
  $('cov').style.width = d.cov.total ? `${Math.round(d.cov.filled / d.cov.total * 100)}%` : '0';
}

function drawToc(d) {
  if (!d.plan) { $('toc').innerHTML = `<p class="note">${state.noticeText ? esc(d.result?.fallback?.reason || '목차를 만들지 못했습니다') : '공고를 올리면 나옵니다'}</p>`; return; }
  if (!state.open || !d.chapters.some(chapter => chapter.key === state.open)) state.open = d.chapters[0]?.key;
  $('toc').innerHTML = d.chapters.map(chapter => `<button type="button" data-key="${esc(chapter.key)}" class="${chapter.key === state.open ? 'on' : ''}">${esc(chapter.title)}<small>${chapter.pages ?? '?'}쪽 · ${chapter.score.toFixed(1)}점 · ${d.drafts[chapter.key]?.submit ? '초안 있음' : '초안 없음'}</small></button>`).join('');
  $('toc').querySelectorAll('button').forEach(button => button.onclick = () => { state.open = button.dataset.key; draw(); });
}

function drawNeed(d) {
  const chapter = d.chapters.find(item => item.key === state.open);
  // 질문에 화면에서 답한다(11-12). 답은 자동 저장되고, 「답 넣은 project.json 받기」로 생성 도구에 넘긴다.
  const questions = d.allQuestions.length ? `<div class="need"><b>초안 전에 물을 것 ${d.questions.length ? `(남음 ${d.questions.length})` : '(모두 답함)'}</b><ol class="q">${d.allQuestions.map(q => `<li>${esc(q.ask)}<input data-answer="${esc(q.key)}" value="${esc(state.saved.answers?.[q.key] ?? '')}" placeholder="답을 적으면 바로 저장됩니다"></li>`).join('')}</ol><p class="note">답은 이 브라우저에 남습니다. 초안에 넣으려면 「답 넣은 project.json 받기」로 받아 생성 도구에 줍니다 — 한 번 답하면 그 값이 모든 장에 함께 들어갑니다. 답하지 않아도 초안은 만들어지고 그 자리는 [확인 필요]로 남습니다.</p></div>` : '';
  if (!chapter) { $('need').innerHTML = questions || '<p class="note">공고를 올리면 그 장의 절·쪽수·배점·채점 기준이 나옵니다</p>'; return; }
  const points = list => list.map(point => `<li>${esc(point.point)}${point.details.length ? `<ul>${point.details.map(detail => `<li>${esc(detail)}</li>`).join('')}</ul>` : ''}</li>`).join('');
  $('need').innerHTML = chapter.parts.map(part => `<div class="need"><b>${esc(part.key)} ${esc(part.title)}</b>
    <div class="meta">${part.pages ? `${part.pages.value}쪽` : '쪽수 미정'} · ${part.score}점${part.density != null ? ` · ${part.density}점/쪽` : ''}${part.priority.length ? ` · <span class="hold">동점 시 ${part.priority.map(entry => `${entry.rank}순위 ${esc(entry.item)}`).join(', ')}</span>` : ''}</div>
    <ul>${points(part.writeWhat) || '<li class="note">작성내용 없음</li>'}</ul>
    <div class="meta">채점: ${part.scoring.length ? part.scoring.map(entry => `${esc(entry.item)} ${esc(entry.point)} ${entry.role === '부차' ? '(부차)' : `${entry.share.toFixed(1)}점`}${entry.confident ? '' : ' <span class="hold">확인</span>'}`).join(' · ') : '직접 붙은 항목 없음'}</div></div>`).join('') + questions;
  bindAnswers($('need'));
}
function bindAnswers(root) {
  root.querySelectorAll('input[data-answer]').forEach(input => {
    // 글자를 칠 때마다 저장(다시 그리지 않아 입력이 끊기지 않는다), 칸을 떠나면 다시 그린다.
    input.oninput = () => { state.saved.answers = { ...state.saved.answers, [input.dataset.answer]: input.value }; persist(); showSaved(); };
    input.onchange = () => draw();
  });
}

function drawDraft(d) {
  const draft = d.drafts[state.open] || {};
  const text = state.marks && draft.draft ? draft.draft : draft.submit;
  $('marks').hidden = !draft.draft;
  $('marks').textContent = state.marks ? '제출본 보기' : '표시 보기';
  const unmatched = d.unmatched.length ? `<p class="bad">어느 장과도 맞지 않은 파일: ${d.unmatched.map(esc).join(', ')}</p>` : '';
  if (!text) { $('draft').innerHTML = `<p class="note">${d.plan ? '아직 없음. 생성 엔진은 아직 화면과 이어지지 않았습니다 — 터미널 도구(tools/proposal-draft.mjs)가 만든 submit_·draft_ 파일을 4번 칸에 올리면 여기서 봅니다.' : ''}</p>${unmatched}`; return; }
  let fails = '';
  if (draft.checks) {
    try { const list = JSON.parse(draft.checks).filter(check => check.level === 'fail'); fails = list.length ? `<p class="bad">검사 실패 ${list.length}건: ${list.map(check => esc(check.what)).join(', ')}</p>` : '<p><span class="chip ok">검사 실패 없음</span></p>'; }
    catch { fails = '<p class="bad">checks 파일을 읽지 못했습니다</p>'; }
  }
  const all = d.allPendings.filter(item => item.chapter === state.open);
  const left = d.pendings.filter(item => item.chapter === state.open);
  $('draft').innerHTML = `${fails}${all.length ? `<p class="hold">비워 둔 곳 ${all.length}${all.length > left.length ? ` (채움 ${all.length - left.length})` : ''}: ${all.map(item => esc(item.what)).join(' · ')}</p>` : ''}<div class="draft">${esc(text).replace(/^### (.*)$/gm, '<span class="h3">$1</span>').replace(/^## (.*)$/gm, '<span class="h2">$1</span>').replace(/\[확인 필요[^\]]*\]/g, match => `<mark>${match}</mark>`)}</div>${unmatched}`;
}

// 고를 것(11-10): 약속은 묶음마다 「다 할 수 있다 / 뺄 줄 있음」, 값은 칸에 채우고, 문구는 기본 채택(펼쳐 보기).
// 11-12: 고르거나 채울 때마다 바로 저장(state.saved). 문구 줄은 「약속으로 옮기기」 — 기준(→ 꼴)은 그대로 두고 기록을 모은다.
function drawChoose(d) {
  const draft = d.drafts[state.open] || {};
  const chapter = d.chapters.find(item => item.key === state.open);
  $('choose').hidden = !(draft.draft && chapter);
  if (!draft.draft || !chapter) return;
  let checks = [];
  try { checks = draft.checks ? JSON.parse(draft.checks) : []; } catch { checks = []; }
  const c = choicesOf(draft.draft, { parts: chapter.parts.map(part => ({ key: part.key, title: part.title, score: part.score })), checks, chapter: chapter.key, moved: state.saved.moved || {} });
  const picks = state.saved.choices || {};
  const values = state.saved.values || {};
  const lines = list => list.reduce((sum, entry) => sum + entry.lines.length, 0);
  const decided = c.promises.filter(entry => picks[entry.id]?.status).length;
  const filled = c.values.flatMap(entry => entry.lines.flatMap(line => line.pendings)).filter(item => String(values[item.id] ?? '').trim()).length;
  const valueCount = c.values.flatMap(entry => entry.lines.flatMap(line => line.pendings)).length;
  // 머리 하나뿐인 묶음은 이름을 따로 보이지 않는다(11-14). 머리가 점수 줄이었으면 이름에 ★.
  const label = entry => [entry.part ? `${esc(entry.part)}${entry.score ? ` · ${entry.score}점` : ''}` : '', entry.standalone ? '' : `${esc(entry.title)}${entry.headScore ? ' <span class="star">★점수 줄</span>' : ''}`].filter(Boolean).join(' · ');
  const star = line => line.score ? ' <span class="star">★점수 줄</span>' : '';
  const marked = text => esc(text).replace(/\[확인 필요[^\]]*\]/g, match => `<mark>${match}</mark>`);
  const promise = entry => {
    const pick = picks[entry.id] || {};
    const dropped = new Set(pick.dropped || []);
    const back = line => line.moved ? ` <button class="move" data-unmove="${esc(line.id)}" type="button">문구로 되돌리기</button>` : '';
    const items = entry.lines.map(line => pick.status === 'edit'
      ? `<li><label><input type="checkbox" data-group="${esc(entry.id)}" data-line="${esc(line.id)}" ${dropped.has(line.id) ? '' : 'checked'}> <span>${esc(line.text)}${star(line)}</span></label>${back(line)}${line.score && dropped.has(line.id) ? '<div class="warn">이 줄은 채점 기준의 답으로 고른 줄입니다 — 빼면 그 답이 사라질 수 있습니다</div>' : ''}</li>`
      : `<li>${esc(line.text)}${star(line)}${back(line)}</li>`).join('');
    return `<div class="grp ${pick.status ? 'done' : ''}"><div class="top"><span>${label(entry)} <small>${entry.lines.length}줄</small></span><span class="acts"><button class="btn sm ${pick.status === 'ok' ? 'on' : ''}" data-ok="${esc(entry.id)}" type="button">다 할 수 있다</button><button class="btn sm ${pick.status === 'edit' ? 'on' : ''}" data-edit="${esc(entry.id)}" type="button">뺄 줄 있음</button></span></div><ul>${items}</ul></div>`;
  };
  // 값: 빈칸마다 칸 하나. id는 「장:몇째」 — 같은 이름표라도 자리가 다르면 다른 값이다.
  const valueGroup = entry => `<div class="grp"><div class="top"><span>${label(entry)}</span></div><ul>${entry.lines.map(line => `<li>${marked(line.text)}${star(line)}${line.pendings.map(item => `<div class="fill"><small>${esc(item.what)}</small><input data-value="${esc(item.id)}" class="${String(values[item.id] ?? '').trim() ? 'done' : ''}" value="${esc(values[item.id] ?? '')}" placeholder="채우면 바로 저장됩니다"></div>`).join('')}</li>`).join('')}</ul></div>`;
  // 문구: 묶음째 받기/빼기(11-16 C). 기본은 받기 — 누르지 않아도 받은 것이다. 뺀 묶음에 점수 줄이 있으면 알리기만 한다.
  const dropped = entry => picks[entry.pickId]?.status === 'drop';
  const wordingGroup = entry => `<div class="grp ${dropped(entry) ? 'off' : ''}"><div class="top"><span>${label(entry)} <small>${entry.lines.length}줄</small></span><span class="acts"><button class="btn sm ${dropped(entry) ? '' : 'on'}" data-take="${esc(entry.pickId)}" type="button">받기</button><button class="btn sm ${dropped(entry) ? 'on' : ''}" data-drop="${esc(entry.pickId)}" type="button">빼기</button></span></div><ul>${entry.lines.map(line => `<li>${marked(line.text)}${star(line)} <button class="move" data-move="${esc(line.id)}" data-text="${esc(line.text)}" data-part="${esc(line.part || '')}" data-group="${esc(line.groupTitle || '')}" type="button">약속으로 옮기기</button></li>`).join('')}</ul>${dropped(entry) && entry.hasScore ? '<div class="warn">이 묶음에 채점 기준의 답으로 고른 줄이 있습니다 — 빼면 그 답이 사라질 수 있습니다</div>' : ''}</div>`;
  const droppedCount = c.wording.filter(dropped).length;
  $('choose').innerHTML = `<h2>고를 것 — ${esc(chapter.title)}</h2>
    <p class="note">제안 ${c.total}줄. 누를 것은 약속 ${c.promises.length}묶음입니다(정함 ${decided} / ${c.promises.length}). 값은 칸에 채웁니다(채움 ${filled} / ${valueCount}). 문구는 묶음째 받기/빼기입니다(누르지 않으면 받기) — 약속인데 문구에 들어간 줄은 「약속으로 옮기기」. 약속은 「활동 → 하는 일 → 결과물」 꼴이라 선정되면 협약 의무가 됩니다.</p>
    <h3>할 수 있나 — 약속 ${c.promises.length}묶음 · ${lines(c.promises)}줄 (배점 큰 절부터)</h3>${c.promises.map(promise).join('') || '<p class="note">없음</p>'}
    <h3>채울 값 — ${valueCount}칸 (채움 ${filled})</h3>${c.values.map(valueGroup).join('') || '<p class="note">없음</p>'}
    <details ${state.wordingOpen ? 'open' : ''}><summary>문구 ${c.wording.length}묶음 · ${lines(c.wording)}줄 — 묶음째 받기/빼기, 기본은 받기${droppedCount ? ` · 뺌 ${droppedCount}` : ''} · 펼쳐 보기</summary>${c.wording.map(wordingGroup).join('')}</details>`;
  const root = $('choose');
  const setPick = (id, patch) => change(saved => { saved.choices = { ...saved.choices, [id]: { ...(saved.choices?.[id] || {}), ...patch, at: new Date().toISOString() } }; });
  root.querySelector('details').ontoggle = event => { state.wordingOpen = event.target.open; };
  root.querySelectorAll('[data-ok]').forEach(button => button.onclick = () => setPick(button.dataset.ok, { status: 'ok', dropped: [] }));
  root.querySelectorAll('[data-edit]').forEach(button => button.onclick = () => setPick(button.dataset.edit, { status: 'edit' }));
  root.querySelectorAll('[data-take]').forEach(button => button.onclick = () => setPick(button.dataset.take, { status: 'take' }));
  root.querySelectorAll('[data-drop]').forEach(button => button.onclick = () => setPick(button.dataset.drop, { status: 'drop' }));
  root.querySelectorAll('input[data-line]').forEach(box => box.onchange = () => {
    const dropped = new Set(picks[box.dataset.group]?.dropped || []);
    if (box.checked) dropped.delete(box.dataset.line); else dropped.add(box.dataset.line);
    setPick(box.dataset.group, { dropped: [...dropped] });
  });
  root.querySelectorAll('input[data-value]').forEach(input => {
    input.oninput = () => { state.saved.values = { ...state.saved.values, [input.dataset.value]: input.value }; persist(); showSaved(); input.classList.toggle('done', input.value.trim() !== ''); };
    input.onchange = () => draw();
  });
  // 약속으로 옮긴 기록 — 장·절·묶음·글·언제. 쌓이면 「→ 꼴」 기준을 다듬는 재료가 된다(사용자 결정 11-12).
  root.querySelectorAll('[data-move]').forEach(button => button.onclick = () => change(saved => { saved.moved = { ...saved.moved, [button.dataset.move]: { chapter: chapter.key, part: button.dataset.part || null, group: button.dataset.group || null, text: button.dataset.text, at: new Date().toISOString() } }; }));
  root.querySelectorAll('[data-unmove]').forEach(button => button.onclick = () => change(saved => { const next = { ...saved.moved }; delete next[button.dataset.unmove]; saved.moved = next; }));
}

function drawRules(d) {
  const c = d.result?.constraints;
  $('rulesBox').hidden = !c;
  if (!c) return;
  const rows = [];
  for (const amount of c.amounts) rows.push([amount.label, `${won(amount.won)}${amount.vatIncluded ? ' (부가가치세 포함)' : ''}`]);
  for (const cap of c.ratioCaps) rows.push([`${cap.what} 비율`, `${cap.of ? `${cap.of}의 ` : ''}${cap.maxPercent}% ${cap.strict ? '미만' : '이내'}${cap.article ? ` · ${cap.article}` : ''}`]);
  for (const cap of c.pageCaps) rows.push([`${cap.subject} 분량`, `${cap.maxPages}쪽 이내${cap.soft ? ' (권장)' : ''}`]);
  for (const period of c.periods) rows.push([period.label, `${period.from} ~ ${period.to}`]);
  for (const rule of c.prohibitions) rows.push(['금지', '제안서에 금액을 적지 않는다']);
  const format = d.plan?.format;
  if (format) for (const style of format.styles) rows.push([`글머리 「${style.marker}」`, `${style.size}pt ${style.font}`]);
  $('rules').innerHTML = `<table>${rows.map(([what, value]) => `<tr><th>${esc(what)}</th><td>${esc(value)}</td></tr>`).join('')}</table>`;
}

function draw() {
  const d = derive();
  drawSteps(d); drawHeader(d); drawSave(); drawNext(d); drawToc(d); drawNeed(d); drawDraft(d); drawChoose(d); drawRules(d);
}

// 공고가 정해지면 그 공고의 칸을 연다. 다른 공고를 올리면 다른 칸 — 섞이지 않는다.
function openSaved() {
  const key = noticeKey(state.noticeText);
  if (key === state.key) return;
  state.key = key;
  const read = readSaved(store, key);
  state.saved = read.saved;
  state.saveStatus = read.ok ? (store ? { ok: true, savedAt: read.saved.savedAt } : { ok: false, reason: '이 브라우저는 저장소를 주지 않습니다' }) : { ok: false, reason: read.reason };
}

async function loadNotice(files) {
  const texts = [];
  const names = [];
  let pages = 0;
  for (const file of files) {
    try {
      if (/\.json$/i.test(file.name)) { state.project = JSON.parse(await file.text()); continue; }
      const read = await readOne(file);
      texts.push(read.text); names.push(file.name); pages += read.pages || 0;
    } catch (error) { alert(`${file.name} — ${error.message}`); }
  }
  if (texts.length) { state.noticeText = texts.join('\n\n'); state.noticeNames = names; state.noticePages = pages || null; openSaved(); }
  draw();
}
async function loadFacts(files) {
  for (const file of files) {
    try { state.facts.push({ source: file.name, text: await textOf(file) }); } catch (error) { alert(`${file.name} — ${error.message}`); }
  }
  draw();
}
async function loadDrafts(files) {
  for (const file of files) state.files = [...state.files.filter(item => item.name !== file.name), { name: file.name, text: await file.text() }];
  draw();
}
$('marks').onclick = () => { state.marks = !state.marks; draw(); };
// 불러오기: 내보낸 파일을 지금 공고의 칸에 넣는다. 다른 공고의 것이면 묻는다(섞이지 않게).
$('importFile').addEventListener('change', async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || !state.key) return;
  const read = importFile(await file.text(), { key: state.key });
  if (!read.ok) { alert(`${file.name} — ${read.reason}`); return; }
  if (read.otherNotice && !confirm(`이 파일은 다른 공고(${read.notice || '이름 없음'})에서 내보낸 것입니다. 지금 공고에 넣을까요?`)) return;
  const hasNow = ['choices', 'values', 'answers', 'moved'].some(field => Object.keys(state.saved[field] || {}).length);
  if (hasNow && !confirm('지금 이 공고에 고른 것·채운 값이 있습니다. 불러온 파일로 바꿀까요?')) return;
  state.saved = read.saved;
  persist();
  draw();
});
draw();
</script>
</body>
