<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공고 읽기</title>
<meta name="description" content="공고(RFP)를 올리면 평가표에서 제안서 목차를, 본문에서 금액·기간·쪽수·비율 한도를 읽어 보여 줍니다.">
<style>
  :root { --bg:#fff; --ink:#1b1f23; --sub:#5b636b; --line:#e3e6ea; --accent:#0b6b3a; --soft:#f3f6f4; --warn:#b4231b; --hold:#8a5a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171a; --ink:#eceff2; --sub:#9aa3ab; --line:#2b3238; --accent:#4fd18b; --soft:#1c2125; --warn:#ff8a80; --hold:#f2c14e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 system-ui,"Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  h2 { font-size:17px; margin:28px 0 8px; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 20px; }
  .drop { display:block; padding:18px; border:1px dashed var(--line); border-radius:10px; background:var(--soft); }
  .drop input { display:block; margin-top:8px; max-width:100%; }
  textarea { width:100%; min-height:90px; margin-top:10px; padding:8px; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  button { margin-top:8px; padding:8px 14px; font:inherit; color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  .note { font-size:14px; color:var(--sub); }
  .bad { color:var(--warn); }
  .hold { color:var(--hold); }
  ol.toc { padding-left:22px; }
  ol.toc > li { margin:0 0 12px; }
  ol.toc .score { color:var(--accent); font-weight:700; margin-left:6px; }
  ol.toc ul { margin:4px 0 0; padding-left:18px; font-size:14px; }
  ol.toc ul ul { color:var(--sub); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--sub); font-weight:600; width:34%; }
  td q { color:var(--sub); font-size:13px; display:block; quotes:none; }
  .wrap { overflow-x:auto; }
  .files { font-size:13px; color:var(--sub); margin:8px 0 0; }
</style>
</head>
<body>
<main>
  <h1>공고 읽기</h1>
  <p class="sub">공고를 올리면 목차표와 평가표에서 절마다 작성지시(쪽수·배점·채점 기준)를, 본문에서 금액·기간·쪽수·비율 한도를 읽습니다. 파일은 이 브라우저 안에서만 읽고 어디로도 보내지 않습니다.</p>

  <label class="drop">공고 파일(HWPX·HWP·TXT, 여러 개 가능 — 요강과 신청서 양식을 함께 올리면 같이 읽습니다). 기관이 정한 것(project.json)도 함께 올리면 생성 도구와 같은 표를 봅니다
    <input id="file" type="file" accept=".hwpx,.hwp,.txt,.json" multiple>
  </label>
  <p class="files" id="files"></p>
  <details>
    <summary class="note">PDF이거나 파일이 열리지 않으면 — 본문 글자를 붙여 넣기</summary>
    <textarea id="paste" placeholder="공고 본문을 붙여 넣으세요. 표는 칸이 탭으로 나뉘어 있어야 평가표로 읽힙니다."></textarea>
    <button id="read" type="button">붙여 넣은 글 읽기</button>
  </details>

  <div id="out"></div>
</main>
<script type="module">
import { extractHwpxText } from '../lib/hwpx-text.js';
import { extractHwpDocument } from '../lib/hwp-text.js';
import { readPlan } from './rfp-plan.js';

const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const won = value => `${Number(value).toLocaleString('ko-KR')}원`;

async function textOf(file) {
  const extension = file.name.split('.').pop().toLowerCase();
  if (extension === 'txt') return file.text();
  if (extension === 'hwpx') return extractHwpxText(await file.arrayBuffer());
  if (extension === 'hwp') return (await extractHwpDocument(await file.arrayBuffer())).text;
  throw new Error('HWPX·HWP·TXT만 읽습니다. PDF는 본문을 붙여 넣어 주세요.');
}

function outlineHtml({ evaluation, outline, fallback }) {
  if (!outline) {
    return `<h2>제안서 목차</h2><p class="hold">평가표로 목차를 만들지 않았습니다 — ${esc(fallback.reason)}. 이 공고는 지금처럼 신청서 양식을 따라 씁니다.</p>`;
  }
  const checks = evaluation.checks.filter(check => !check.ok);
  return `<h2>제안서 목차 <span class="note">(${esc(outline.from)} · ${outline.total}점)</span></h2>
    ${checks.length ? `<p class="bad">배점 합이 맞지 않습니다: ${checks.map(check => `${esc(check.what)} — ${esc(check.detail)}`).join(', ')}</p>` : ''}
    <ol class="toc">${outline.sections.map(section => `<li><b>${esc(section.title)}</b><span class="score">${section.score}점</span>
      ${section.aliases.length ? `<span class="note"> (요약표: ${section.aliases.map(esc).join(', ')})</span>` : ''}
      <ul>${section.writeWhat.map(point => `<li>${esc(point.point)}${point.details.length ? `<ul>${point.details.map(detail => `<li>${esc(detail)}</li>`).join('')}</ul>` : ''}</li>`).join('')}</ul></li>`).join('')}</ol>
    ${outline.leftOut.length ? `<p class="note">목차에서 뺀 항목(서식·증빙으로 평가): ${outline.leftOut.map(item => `${esc(item.name)} ${item.score}점`).join(', ')}</p>` : ''}`;
}

function constraintsHtml(c) {
  const rows = [];
  for (const amount of c.amounts) rows.push([amount.label, `${won(amount.won)}${amount.vatIncluded ? ' (부가가치세 포함)' : ''}${amount.period.length ? ` · ${amount.period.join(' ~ ')}` : ''}`, amount.quote]);
  for (const item of c.derived) rows.push([item.label, won(item.won), item.basis]);
  if (c.longTerm) rows.push(['장기계속 계약', `${c.longTerm.years ?? '?'}년 · ${c.longTerm.installments.map(item => `${item.label} ${won(item.won)}`).join(', ') || '차수 금액 없음'}`, '']);
  for (const period of c.periods) rows.push([period.label, `${period.from} ~ ${period.to}${period.years ? ` (${period.years}년)` : ''}`, period.quote]);
  for (const cap of c.ratioCaps) rows.push([`${cap.what} 비율`, `${cap.of ? `${cap.of}의 ` : ''}${cap.maxPercent}% ${cap.strict ? '미만' : '이내'}${cap.conditional ? ' · 조건부' : ''}${cap.article ? ` · ${cap.article}` : ''}`, cap.quote]);
  for (const cap of c.amountCaps) rows.push([`${cap.what || '금액'} 한도`, `${cap.per ? `${cap.per} ` : ''}${won(cap.maxWon)} 이하${cap.conditional ? ' · 조건부' : ''}`, cap.quote]);
  for (const cap of c.pageCaps) rows.push([`${cap.subject} 분량`, `${cap.maxPages}쪽 이내${cap.soft ? ' (권장)' : ''}`, cap.quotes[0]]);
  for (const rule of c.prohibitions) rows.push(['금지', '제안서에 금액을 적지 않는다', rule.quote]);
  const bad = c.checks.filter(check => !check.ok);
  return `<h2>하드 제약 <span class="note">(${rows.length}건 · 공고 글자에서 읽음)</span></h2>
    ${bad.length ? `<p class="bad">${bad.map(check => `${esc(check.what)}: ${esc(check.detail)}`).join(', ')}</p>` : ''}
    ${rows.length ? `<div class="wrap"><table>${rows.map(([what, value, quote]) => `<tr><th>${esc(what)}</th><td>${esc(value)}${quote ? `<q>${esc(quote)}</q>` : ''}</td></tr>`).join('')}</table></div>` : '<p class="note">읽은 제약이 없습니다.</p>'}`;
}

// 목차표가 있으면 그 목차가 제출 목차이고, 평가표 배점은 절마다 붙는 채점 기준이다(10-06).
function planHtml({ plan }, project) {
  if (!plan || plan.from !== '목차표') return '';
  const pages = plan.pages;
  const points = list => list.map(point => `<li>${esc(point.point)}${point.details.length ? `<ul>${point.details.map(detail => `<li>${esc(detail)}</li>`).join('')}</ul>` : ''}</li>`).join('');
  const scoring = section => section.scoring.length
    ? section.scoring.map(entry => `<li><b>${esc(entry.item)}</b> ${esc(entry.point)} <span class="note">${entry.role === '부차' ? '부차(배점은 본진 절에)' : `${entry.share.toFixed(1)}점`}${entry.by === '사람' ? ' · 사람이 정함' : ''}${entry.confident ? '' : ' · <span class="hold">다른 절과 비슷하게 맞음 — 확인</span>'}</span></li>`).join('')
    : '<li class="note">직접 붙은 평가 항목 없음 — 작성내용을 따른다</li>';
  const check = plan.scoreCheck;
  return `<h2>제출 목차와 작성지시 <span class="note">(공고 목차표 · 평가표 배점을 절에 붙임)</span></h2>
    ${project ? `<p class="note">기관이 정한 것(${esc(project.name)}): 평가 항목 연결 ${plan.decided.length}건을 글자 비교보다 먼저 반영 — ${plan.decided.map(esc).join(', ') || '없음'}</p>` : `<p class="hold">project.json을 올리지 않아 평가 항목을 글자 비교로만 붙였습니다. 생성 도구는 project.json을 읽으므로, 함께 올리지 않으면 이 표와 생성에 쓰는 표가 다를 수 있습니다.</p>`}
    ${pages.total ? `<p class="note">${esc(pages.totalFrom)} ${pages.total}쪽 = 정해진 ${pages.fixed}쪽(표지·목차 ${pages.front}쪽 포함) + 자유분량 ${pages.free ?? 0}쪽.${pages.level != null ? ` 자유분량 절은 정해진 절의 수준 <b>${pages.level}점/쪽</b>(${esc(pages.levelFrom)})에 맞춰 배정.` : ''}</p>` : ''}
    ${pages.unused != null ? `<p class="${pages.unused ? 'hold' : 'note'}">쓰는 쪽: ${pages.fixed + pages.used}쪽 / ${pages.total}쪽 — <b>${pages.unused}쪽은 쓰지 않음</b>(「이내 권장」이라 덜 써도 감점이 없고, 출력이 가장 비싸다).</p>` : ''}
    ${check ? `<p class="${check.ok ? 'note' : 'bad'}">배점: 절에 붙은 ${check.sections.toFixed(1)}점 + 전체에 걸친 ${check.crossCutting.toFixed(1)}점 = ${(check.sections + check.crossCutting).toFixed(1)}점 / 평가표 ${check.total}점</p>` : ''}
    ${plan.priority ? `<p class="note">동점 우선순위(공고 순서, 분량 계산에는 쓰지 않음): ${plan.priority.order.map(entry => `${entry.rank}. ${esc(entry.name)}`).join(' → ')}</p>` : ''}
    <ol class="toc">${plan.sections.map(section => `<li><b>${esc(section.key)} ${esc(section.title)}</b>${section.chapter ? `<span class="note"> · ${esc(section.chapter)}</span>` : ''}
      <span class="score">${section.pages ? `${section.pages.value}쪽` : '쪽수 미정'} · ${section.score}점${section.density != null ? ` · <b>${section.density}점/쪽</b>` : ''}</span>
      ${section.priority.length ? `<div class="hold">동점 시 ${section.priority.map(entry => `${entry.rank}순위 ${esc(entry.item)}`).join(', ')}</div>` : ''}
      ${section.pages ? `<div class="note">${esc(section.pages.basis)}${section.pages.max ? ' (이내)' : ''}</div>` : ''}
      <div class="note">작성내용</div><ul>${points(section.writeWhat) || '<li class="note">없음</li>'}</ul>
      <div class="note">채점 기준</div><ul>${scoring(section)}</ul></li>`).join('')}</ol>
    ${plan.crossCutting.length ? `<p class="note">전체에 걸친 채점 기준(특정 절에 붙지 않음): ${plan.crossCutting.map(entry => `${esc(entry.item)} — ${esc(entry.point)} ${entry.share.toFixed(1)}점`).join(', ')}</p>` : ''}
    ${formatHtml(plan.format)}`;
}

function formatHtml(format) {
  if (!format) return '';
  const rows = [['용지', [format.paper, format.orientation].filter(Boolean).join(' ')], ['파일', format.fileFormat], ['쪽번호', format.pageNumber], ['표지', format.cover],
    ...format.styles.map(style => [`글머리 「${style.marker}」`, `${style.size}pt ${style.font}`])].filter(([, value]) => value);
  return `<h2>출력 규칙 <span class="note">(${esc(format.heading)})</span></h2><div class="wrap"><table>${rows.map(([what, value]) => `<tr><th>${esc(what)}</th><td>${esc(value)}</td></tr>`).join('')}</table></div>`;
}

// project.json(기관이 정한 것)은 생성 도구(tools/proposal-draft.mjs)와 같은 것을 같은 함수에 넘긴다 — 판정은 readPlan 한 곳(10-08).
let project = null;
function show(text) {
  const result = readPlan(text, { project: project?.data });
  $('out').innerHTML = (result.plan?.from === '목차표' ? planHtml(result, project) : outlineHtml(result)) + constraintsHtml(result.constraints);
}

$('file').addEventListener('change', async event => {
  const files = [...event.target.files];
  if (!files.length) return;
  $('out').innerHTML = '<p class="note">읽는 중…</p>';
  const texts = [];
  const notes = [];
  project = null;
  for (const file of files) {
    if (/\.json$/i.test(file.name)) {
      try { project = { name: file.name, data: JSON.parse(await file.text()) }; notes.push(`${file.name} — 기관이 정한 것으로 읽음`); }
      catch (error) { notes.push(`${file.name} — JSON이 아닙니다: ${error.message}`); }
      continue;
    }
    try { texts.push(await textOf(file)); notes.push(`${file.name} — 읽음`); }
    catch (error) { notes.push(`${file.name} — ${error.message}`); }
  }
  $('files').textContent = notes.join(' · ');
  if (texts.length) show(texts.join('\n\n')); else $('out').innerHTML = '<p class="bad">읽은 파일이 없습니다.</p>';
});
$('read').addEventListener('click', () => { if ($('paste').value.trim()) show($('paste').value); });
</script>
</body>
</html>
