<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>찾을 수 없는 주소 · MS12</title>
<style>
  body { font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; color: #33261d; background: #faf6f0; margin: 0; }
  main { max-width: 460px; margin: 12vh auto; padding: 24px; background: #fff; border: 1px solid #e8dfd4; border-radius: 16px; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #7c6c5e; line-height: 1.6; font-size: 14px; margin: 8px 0; }
  a { display: inline-block; margin-top: 14px; background: #8c5a33; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 9px; font-weight: 800; }
</style>
</head>
<body>
<main>
  <h1>찾을 수 없는 주소입니다</h1>
  <p>주소가 바뀌었거나 없는 페이지입니다.</p>
  <p id="asset-note" hidden>새 판이 배포되어 이전 화면이 쓰던 파일이 사라졌습니다. 처음 화면으로 돌아가면 정상으로 돌아옵니다.</p>
  <a href="/">처음 화면으로</a>
</main>
<script>
  // 자산(/assets/...) 요청이 여기까지 오면 배포가 갱신된 것이다.
  // 이 파일은 404로 내려가므로 앱이 「없는 자산」을 정확히 알아챌 수 있다.
  if (location.pathname.startsWith('/assets/')) document.getElementById('asset-note').hidden = false;
</script>
</body>
</html>
