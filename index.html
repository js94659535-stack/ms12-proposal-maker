                            <p>좌측에서 정보를 입력하고 생성 버튼을 누르면<br>이곳에 맞춤형 제안서가 작성됩니다.</p>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('ms12_auto_login') === 'true') {
                document.getElementById('password-overlay').style.display = 'none';
            }
            switchMenu('menu-chest');
        });

        function checkPassword() {
            const inputVal = document.getElementById('access-password').value;
            const autoLogin = document.getElementById('auto-login').checked;
            
            if (inputVal === "ms12") {
                document.getElementById('password-overlay').style.display = 'none';
                if (autoLogin) localStorage.setItem('ms12_auto_login', 'true');
                else localStorage.removeItem('ms12_auto_login');
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
        
        document.getElementById('access-password').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') checkPassword();
        });

        function switchMenu(menuId) {
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-400');
                btn.classList.add('text-slate-300', 'border-transparent');
            });
            
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.add('hidden'));
            
            const activeBtn = document.getElementById('btn-' + menuId);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-300', 'border-transparent');
                activeBtn.classList.add('bg-slate-800', 'text-white', 'border-indigo-500');
            }
            
            const activeForm = document.getElementById(menuId);
            if(activeForm) activeForm.classList.remove('hidden');

            const titles = {
                'menu-chest': '사랑의열매 프로포절 폼',
                'menu-family': '가족센터 제안서 폼',
                'menu-edu': '학교/교육청 기안 폼',
                'menu-g2b': '나라장터 입찰 폼',
                'menu-general': '일반 사업계획서 폼'
            };
            document.getElementById('form-title').innerText = titles[menuId] || '제안서 정보 입력';
        }

        function copyContent() {
            const doc = document.getElementById('document-view');
            if (doc.classList.contains('hidden') || doc.innerText.trim() === '') {
                alert('복사할 내용이 없습니다.'); return;
            }
            navigator.clipboard.writeText(doc.innerText).then(() => {
                alert('클립보드에 복사되었습니다!');
            });
        }

        function generateContent(type) {
            const activeForm = document.getElementById('menu-' + type);
            const btn = activeForm.querySelector('button');
            const spinner = btn.querySelector('.spinner');
            const btnText = btn.querySelector('span');
            const originalText = btnText.innerText;
            
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'AI 작성 중...';
            
            setTimeout(() => {
                let html = '';
                
                if (type === 'chest') {
                    const name = document.getElementById('chest-name').value || '기본 프로그램';
                    const target = document.getElementById('chest-target').value || '지역 아동';
                    const prog = document.getElementById('chest-program').value;
                    const goal = document.getElementById('chest-goal').value || '긍정적 변화 유도';
                    
                    html = `
                        <h1 class="text-2xl font-bold text-slate-800 mb-6 pb-2 border-b-2 border-indigo-500">배분신청서 (프로포절)</h1>
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">1. 사업명</h2>
                        <p class="mb-4">${name}</p>
                        
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">2. 사업의 필요성 및 대상</h2>
                        <p class="mb-2">본 사업의 핵심 타겟인 <strong>${target}</strong>은(는) 최근 심리적, 교육적 지원의 사각지대에 놓여 있습니다.</p>
                        <p class="mb-4">특히 잦은 미디어 노출과 학습 동기 저하로 인해 자아존중감이 하락하는 문제가 대두되어, 실질적이고 과학적인 개입이 절실한 상황입니다.</p>
                        
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">3. 세부 사업 내용</h2>
                        <p class="mb-2">마인드스토리의 검증된 솔루션인 <strong>[${prog}]</strong>을(를) 활용하여 주 1회, 총 12회기 프로그램을 구성합니다.</p>
                        <ul class="list-disc pl-5 mb-4 space-y-1">
                            <li>사전 진단: 참여자 특성 파악 및 데이터 기반 맞춤형 접근</li>
                            <li>본 프로그램: ${prog} 활동을 통한 정서 이완 및 자아 효능감 회복</li>
                            <li>사후 관리: 사전/사후 데이터 비교 및 학부모 피드백 제공</li>
                        </ul>

                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">4. 성과 목표 (Evaluation)</h2>
                        <div class="bg-slate-50 p-4 border border-slate-200 rounded-lg mb-4">
                            <strong>[산출 목표]</strong> 계획된 회기 100% 진행 및 참여율 90% 이상 달성<br><br>
                            <strong>[성과 목표]</strong> ${goal}
                        </div>
                    `;
                } else if (type === 'family') {
                    const center = document.getElementById('family-center').value;
                    const fType = document.getElementById('family-type').value;
                    const fname = document.getElementById('family-name').value || '가족 프로그램';
                    
                    html = `
                        <h1 class="text-2xl font-bold text-slate-800 mb-6 pb-2 border-b-2 border-indigo-500">[${center}] 가족센터 사업계획서</h1>
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">1. 프로그램 명칭</h2>
                        <p class="mb-4 font-semibold text-slate-900">${fname}</p>
                        
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">2. 추진 배경 및 필요성</h2>
                        <p class="mb-2">본 프로그램은 지역 내 다문화 및 취약계층 가정의 ${fType}을(를) 목적으로 합니다.</p>
                        <p class="mb-4">마인드스토리의 전문 심리상담사와 프로그램 운영 노하우를 결합하여 정서적 지지 기반을 형성하고 건강한 가정 환경을 조성하고자 합니다.</p>
                        
                        <h2 class="text-lg font-bold text-indigo-700 mt-6 mb-2">3. 세부 운영 내용</h2>
                        <ul class="list-disc pl-5 mb-4 space-y-1">
                            <li>진행 기간: 2026년 연중 상시 및 기수별 운영</li>
                            <li>참여 대상: 지역 내 다문화가족 및 일반 가정 자녀·부모</li>
                            <li>주요 활동: 예술·놀이 활동을 통한 상호작용 증진 및 심리 정서 안정</li>
                        </ul>
                    `;
                } else if (type === 'edu') {
                    const target = document.getElementById('edu-target').value;
                    const bType = document.getElementById('edu-type').value;
                    const test = document.getElementById('edu-test').value;
                    
                    html = `
                        <h1 class="text-2xl font-bold text-slate-800 mb-6 pb-2 border-b-2 border-indigo-500">[${target} 제출용] 사업계획서</h1>
                        <h2 class="text-lg font-bold text-slate-800 mt-6 mb-2">Ⅰ. 과업의 개요</h2>
                        <p class="mb-2">1. 사 업 명: 2026학년도 ${bType} 위탁 운영</p>
                        <p class="mb-4">2. 운영목적: 학생들의 기초학력 보장 및 심리/정서적 안정을 도모하여 학교 생활 적응력을 강화함.</p>
                        
                        <h2 class="text-lg font-bold text-slate-800 mt-6 mb-2">Ⅱ. 세부 운영 계획</h2>
                        <p class="mb-2">본 기관(마인드스토리)은 단순 주입식 교육을 지양하고, <strong>${test}</strong>를 활용한 객관적인 데이터 기반 맞춤형 처방을 제공합니다.</p>
                        <table class="w-full text-sm border-collapse border border-slate-300 mb-4 mt-2">
                            <tr class="bg-slate-100">
                                <th class="border border-slate-300 p-2">회차</th>
                                <th class="border border-slate-300 p-2">주제</th>
                                <th class="border border-slate-300 p-2">주요 내용</th>
                            </tr>
                            <tr><td class="border border-slate-300 p-2 text-center">1~2</td><td class="border border-slate-300 p-2">사전 진단</td><td class="border border-slate-300 p-2">${test} 실시 및 개별 프로파일 분석</td></tr>
                            <tr><td class="border border-slate-300 p-2 text-center">3~8</td><td class="border border-slate-300 p-2">역량 강화</td><td class="border border-slate-300 p-2">메타인지 및 학습동기(4R's) 향상 실전 훈련</td></tr>
                            <tr><td class="border border-slate-300 p-2 text-center">9~10</td><td class="border border-slate-300 p-2">사후 평가</td><td class="border border-slate-300 p-2">사후 검사 진행 및 변화량 측정, 수료식</td></tr>
                        </table>
                    `;
                } else if (type === 'g2b') {
                    const title = document.getElementById('g2b-title').value || '용역 입찰 과업';
                    const strat = document.getElementById('g2b-strategy').options[document.getElementById('g2b-strategy').selectedIndex].text;
                    
                    html = `
                        <h1 class="text-2xl font-bold text-slate-800 mb-6 pb-2 border-b-2 border-slate-800">과 업 수 행 계 획 서</h1>
                        <h3 class="text-md font-semibold text-slate-600 mb-6">입찰건명: ${title}</h3>
                        
                        <h2 class="text-lg font-bold text-slate-800 mt-6 mb-2">제 1 장. 제안의 개요</h2>
                        <p class="mb-4 pl-4 border-l-4 border-slate-300">당사는 본 과업지시서의 요구사항을 명확히 이해하고 있으며, 다년간의 공공기관 교육/상담 용역 수행 실적을 바탕으로 최적의 솔루션을 제안합니다.</p>
                        
                        <h2 class="text-lg font-bold text-slate-800 mt-6 mb-2">제 2 장. 차별화 수행 전략 ★</h2>
                        <p class="mb-2 text-indigo-700 font-bold">▶ ${strat}</p>
                        <p class="mb-4">단순한 과업 수행을 넘어, 당사가 보유한 전문 인프라와 진단 시스템을 총동원하여 정량적, 정성적 KPI를 120% 초과 달성할 수 있는 실행 계획을 수립하였습니다.</p>
                        
                        <h2 class="text-lg font-bold text-slate-800 mt-6 mb-2">제 3 장. 전담 인력 구성</h2>
                        <p class="mb-4">사업총괄책임자(PM)를 필두로 메타인지 지도사, 미술심리상담사 등 자격증을 보유한 A급 전문 인력을 전담 배치하여 사업의 질적 우수성을 담보합니다.</p>
                    `;
                }

                document.getElementById('empty-state').style.display = 'none';
                const docView = document.getElementById('document-view');
                docView.style.display = 'block';
                docView.innerHTML = html;
                
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = originalText;
            }, 1200);
        }
    </script>
</body>
</html>
