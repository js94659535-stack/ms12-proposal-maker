name = "ms12-proposal-maker"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

# OPENAI_API_KEY와 OPENAI_MODEL은 Cloudflare Variables and Secrets에서 설정합니다.
# 이 프로젝트는 대시보드에서 일반 변수를 넣을 수 없고 암호(Secret)만 넣을 수 있다.
# 그래서 비밀이 아닌 값은 여기 [vars]에 적는다. API 키는 절대 여기 적지 않는다.

# AI 호출 단가(1M 토큰당 USD). 없으면 cost_micro가 0으로 기록되고
# AI_PROPOSAL_COST_CAP_USD 상한이 아예 동작하지 않는다(server/ai-usage.js의 budgetState).
# priceOf()가 Number()로 읽으므로 문자열로 적는다. 대시보드 변수도 언제나 문자열로 들어온다.
# gpt-5.6-sol 기준(developers.openai.com/api/docs/pricing, 2026-08-19 확인).
# 모델을 바꾸면 이 셋도 함께 바꾼다.
[vars]
OPENAI_PRICE_INPUT_PER_MTOK = "5.0"
OPENAI_PRICE_CACHED_INPUT_PER_MTOK = "0.5"
OPENAI_PRICE_OUTPUT_PER_MTOK = "30.0"

[[d1_databases]]
binding = "ARCHIVE_DB"
database_name = "ms12-proposal-archive"
database_id = "6bf8da36-9690-4577-8f55-ef316e875ef8"
migrations_dir = "migrations"
